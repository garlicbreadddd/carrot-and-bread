<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bread & carrot 🍞🥕</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- NAV -->
  <nav class="site-nav">
    <a href="index.html" class="nav-home no-transition">
      <span class="home-icon">🍞🥕</span>
      Where Bread Met Carrot
    </a>
  </nav>

  <!-- PAGE -->
  <main class="page">

    <!-- TITLE -->
    <h1 class="page-title animate-fade-in-down">Where Bread Met Carrot</h1>
    <p class="page-subtitle animate-fade-in-down">We're collecting moments, leaving them here as memories !!</p>

    <!--2026-->
    <section class="year-section reveal">
      <h2 class="year-label">2025</h2>

      <div class="activity-grid reveal-stagger">

        <!-- activity card -->
        <a href="activities/template.html" class="activity-card">
          <div class="activity-card__tape"></div>
          <img class="activity-card__img" src="assets/picnic/picnic.jpg" alt="Picnic">
          <div class="activity-card__body">
            <div class="activity-card__title">New Year</div>
            <div class="activity-card__date">January 2026</div>
          </div>
        </a>

      </div>
    </section>

    <!-- 2025 -->
    <section class="year-section reveal">
      <h2 class="year-label">2025</h2>

      <div class="activity-grid reveal-stagger">

        <a href="activities/template.html" class="activity-card">
          <div class="activity-card__tape"></div>
          <div class="activity-card__img-placeholder">a</div>
          <div class="activity-card__body">
            <div class="activity-card__title">a</div>
            <div class="activity-card__date">December 2025</div>
          </div>
        </a>

      </div>
    </section>

  </main>

  <!-- DECORATIONS -->
  <span class="deco deco--star"  style="top:120px; right:60px;  font-size:1.8rem;">⭐</span>
  <span class="deco deco--star"  style="top:300px; left:30px;   font-size:1.2rem;">✨</span>
  <span class="deco"             style="top:500px; right:40px;  font-size:2rem;">🌸</span>
  <span class="deco deco--star"  style="top:700px; left:50px;   font-size:1.5rem;">💫</span>
  <span class="deco"             style="top:900px; right:70px;  font-size:1.6rem;">🎀</span>

  <script src="js/main.js"></script>
</body>
</html>
