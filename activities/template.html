<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>picnic in the park 🧺 — bread &amp; carrot</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <!-- ── NAV ───────────────────────────── -->
  <nav class="site-nav">
    <a href="../index.html" class="nav-home no-transition">
      <span class="home-icon">🏠</span>
      bread &amp; carrot
    </a>
  </nav>

  <!-- ── PAGE ──────────────────────────── -->
  <main class="page">

    <!-- Activity header -->
    <header class="activity-header reveal">
      <div class="activity-date-tag">April 12, 2025</div>
      <h1 class="page-title">picnic in the park 🧺</h1>
      <p class="page-subtitle">we forgot the cutlery. 10/10 would do again.</p>
    </header>

    <!-- ══ PHOTO SECTION 1 ══ -->
    <section class="photo-section reveal">
      <h2 class="photo-section__caption">getting there</h2>

      <!-- collage--2 = 2 photos side by side.
           Options: collage--1, collage--2, collage--3 (hero+2), collage--4 (2x2)
           Mix and match sections for variety! -->
      <div class="collage collage--2 reveal-stagger">
        <div class="photo-item">
          <!-- Replace src with your actual photo path -->
          <!-- <img src="../assets/images/picnic/01.jpg" alt="On the way to the park"> -->
          <div style="aspect-ratio:4/3; background:linear-gradient(135deg,#fde8ef,#fde68a); display:flex; align-items:center; justify-content:center; font-size:3rem;">📸</div>
        </div>
        <div class="photo-item">
          <div style="aspect-ratio:4/3; background:linear-gradient(135deg,#a8e6cf,#c9b8e8); display:flex; align-items:center; justify-content:center; font-size:3rem;">📸</div>
        </div>
      </div>
    </section>

    <!-- ══ PHOTO SECTION 2 ══ -->
    <section class="photo-section reveal">
      <h2 class="photo-section__caption">the spread ✨</h2>

      <!-- collage--3: one big photo left, two stacked right -->
      <div class="collage collage--3 reveal-stagger">
        <div class="photo-item">
          <div style="background:linear-gradient(135deg,#ff8b70,#fde68a); display:flex; align-items:center; justify-content:center; font-size:3rem; min-height:260px;">📸</div>
        </div>
        <div class="photo-item">
          <div style="aspect-ratio:4/3; background:linear-gradient(135deg,#fde8ef,#a8e6cf); display:flex; align-items:center; justify-content:center; font-size:3rem;">📸</div>
        </div>
        <div class="photo-item">
          <div style="aspect-ratio:4/3; background:linear-gradient(135deg,#c9b8e8,#fde8ef); display:flex; align-items:center; justify-content:center; font-size:3rem;">📸</div>
        </div>
      </div>
    </section>

    <!-- ══ PHOTO SECTION 3 ══ -->
    <section class="photo-section reveal">
      <h2 class="photo-section__caption">silly moments 💕</h2>

      <div class="collage collage--4 reveal-stagger">
        <div class="photo-item">
          <div style="aspect-ratio:1; background:linear-gradient(135deg,#fde68a,#ff8b70); display:flex; align-items:center; justify-content:center; font-size:3rem;">📸</div>
        </div>
        <div class="photo-item">
          <div style="aspect-ratio:1; background:linear-gradient(135deg,#a8e6cf,#fde8ef); display:flex; align-items:center; justify-content:center; font-size:3rem;">📸</div>
        </div>
        <div class="photo-item">
          <div style="aspect-ratio:1; background:linear-gradient(135deg,#c9b8e8,#fde68a); display:flex; align-items:center; justify-content:center; font-size:3rem;">📸</div>
        </div>
        <div class="photo-item">
          <div style="aspect-ratio:1; background:linear-gradient(135deg,#fde8ef,#ff8b70); display:flex; align-items:center; justify-content:center; font-size:3rem;">📸</div>
        </div>
      </div>
    </section>

    <!-- ══ BOTTOM NAV ══ -->
    <!-- Update href to point to the actual previous/next activity files.
         Add class "activity-nav__btn--disabled" to hide a button when there's no prev/next. -->
    <nav class="activity-nav reveal">
      <a href="template.html" class="activity-nav__btn activity-nav__btn--disabled">
        ← previous
      </a>
      <a href="../index.html" class="activity-nav__btn no-transition">🏠</a>
      <a href="template.html" class="activity-nav__btn">
        next →
      </a>
    </nav>

  </main>

  <!-- ── DECORATIONS ────────────────────── -->
  <span class="deco deco--star"  style="top:160px; right:50px;  font-size:2rem;">✨</span>
  <span class="deco deco--ribbon" style="top:400px; left:20px;  font-size:2.2rem;">🎀</span>
  <span class="deco"             style="top:650px; right:35px;  font-size:1.8rem;">💛</span>
  <span class="deco deco--star"  style="top:900px; left:40px;   font-size:1.4rem;">⭐</span>
  <span class="deco"             style="top:1100px; right:55px; font-size:1.6rem;">🌷</span>

  <script src="../js/main.js"></script>
</body>
</html>
