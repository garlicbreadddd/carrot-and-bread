<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bread & carrot 🍞🥕</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── NAV ───────────────────────────── -->
  <nav class="site-nav">
    <a href="homepage.html" class="nav-home no-transition">
      <span class="home-icon">🏠</span>
      bread &amp; carrot
    </a>
  </nav>

  <!-- ── PAGE ──────────────────────────── -->
  <main class="page">

    <!-- Hero title -->
    <h1 class="page-title animate-fade-in-down">our adventures ✨</h1>
    <p class="page-subtitle animate-fade-in-down">a little scrapbook of us</p>

    <!-- ══ YEAR 2025 ══ -->
    <section class="year-section reveal">
      <h2 class="year-label">2025</h2>

      <div class="activity-grid reveal-stagger">

        <!-- Activity card — duplicate this block for each activity -->
        <a href="activities/template.html" class="activity-card">
          <div class="activity-card__tape"></div>
          <!-- Replace with: <img class="activity-card__img" src="assets/images/picnic/cover.jpg" alt="Picnic"> -->
          <div class="activity-card__img-placeholder">🧺</div>
          <div class="activity-card__body">
            <div class="activity-card__title">picnic in the park</div>
            <div class="activity-card__date">April 2025</div>
          </div>
        </a>

        <a href="activities/template.html" class="activity-card">
          <div class="activity-card__tape"></div>
          <div class="activity-card__img-placeholder">🎡</div>
          <div class="activity-card__body">
            <div class="activity-card__title">funfair day</div>
            <div class="activity-card__date">March 2025</div>
          </div>
        </a>

        <a href="activities/template.html" class="activity-card">
          <div class="activity-card__tape"></div>
          <div class="activity-card__img-placeholder">🍜</div>
          <div class="activity-card__body">
            <div class="activity-card__title">ramen date</div>
            <div class="activity-card__date">February 2025</div>
          </div>
        </a>

      </div>
    </section>

    <!-- ══ YEAR 2024 ══ -->
    <section class="year-section reveal">
      <h2 class="year-label">2024</h2>

      <div class="activity-grid reveal-stagger">

        <a href="activities/template.html" class="activity-card">
          <div class="activity-card__tape"></div>
          <div class="activity-card__img-placeholder">🎆</div>
          <div class="activity-card__body">
            <div class="activity-card__title">new year fireworks</div>
            <div class="activity-card__date">December 2024</div>
          </div>
        </a>

        <a href="activities/template.html" class="activity-card">
          <div class="activity-card__tape"></div>
          <div class="activity-card__img-placeholder">🍂</div>
          <div class="activity-card__body">
            <div class="activity-card__title">autumn walk</div>
            <div class="activity-card__date">November 2024</div>
          </div>
        </a>

        <!-- add more cards here -->

      </div>
    </section>

  </main>

  <!-- ── DECORATIONS ────────────────────── -->
  <!-- These float around the page. Add/move them freely! -->
  <span class="deco deco--star"  style="top:120px; right:60px;  font-size:1.8rem;">⭐</span>
  <span class="deco deco--star"  style="top:300px; left:30px;   font-size:1.2rem;">✨</span>
  <span class="deco"             style="top:500px; right:40px;  font-size:2rem;">🌸</span>
  <span class="deco deco--star"  style="top:700px; left:50px;   font-size:1.5rem;">💫</span>
  <span class="deco"             style="top:900px; right:70px;  font-size:1.6rem;">🎀</span>

  <script src="js/main.js"></script>
</body>
</html>
